<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el boss</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/estilos.css">
</head>
<body>
    <header class="py-4 bg-dark text-white">
        <h1 class="display-5 fw-bold">
            Adivina de qué Souls es cada boss/jefe
        </h1>
    </header>
    <main class="container my-5">
        <div id="contenedor_juego">
            <div id="juego" class="p-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h2 class="card-title">Souls</h2>
                    </div>
                </div>
            </div>
            <div id="boss" class="p-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h2 class="card-title">Boss</h2>
                    </div>
                </div>
            </div>
        </div>
        <div id="botones" class="mt-4">
            <button id="genera_juego" class="btn btn-primary btn-lg me-2">
                Generar juego
            </button>
            <button id="genera_boss" class="btn btn-danger btn-lg">
                Generar boss/jefe
            </button>
        </div>
    </main>
</body>
</html>
